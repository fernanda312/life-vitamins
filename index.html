<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFE vitamins — Vitaminas reais para pessoas reais</title>
<meta name="description" content="LIFE vitamins.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#fff;color:#111;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.hero{position:relative;width:100%;overflow:hidden}
.hero img.bg{width:100%;height:auto;display:block}
.hero::before{content:"";position:absolute;top:0;left:0;right:0;height:46%;z-index:2;background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,0));pointer-events:none}
header{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:22px 20px}
.logo{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:34px;letter-spacing:-.01em;line-height:1;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.logo em{font-style:italic;font-weight:500}
.menu-btn{width:32px;height:24px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.menu-btn span{display:block;height:3px;background:#fff;border-radius:2px}
.hero-text{position:absolute;top:84px;left:20px;right:20px;z-index:3;text-align:center}
.hero-text h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:48px;line-height:1.0;letter-spacing:-.01em;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.65)}
.hero-text h1 em{font-style:italic;font-weight:500}
.hero-text p{font-size:17px;line-height:1.6;font-weight:600;max-width:340px;margin:22px auto 0;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.65)}
.cta{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:4;white-space:nowrap;background:linear-gradient(135deg,#ec407a,#a21caf 50%,#4a148c);color:#fff;font-weight:700;font-size:16px;padding:16px 30px;border-radius:999px;box-shadow:0 12px 28px rgba(0,0,0,.35)}
@media(min-width:801px){
.hero img.bg{width:100%;height:auto}
.logo{font-size:40px}
.hero-text{top:96px}
.hero-text h1{font-size:110px}
.hero-text p{font-size:19px;max-width:560px}
}
</style>
</head>
<body>
<main>
<section class="hero">
<img class="bg" src="images/hero-vida-glow.jpg" alt="Vida Glow Radiance LIFE vitamins">
<header>
<a class="logo" href="#">LIFE <em>vitamins</em></a>
<button class="menu-btn" aria-label="Menu"><span></span><span></span><span></span></button>
</header>
<div class="hero-text">
<h1>Vitaminas <em>reais</em><br>para pessoas reais</h1>
<p>Suplementos simples, para o dia a dia, em Maputo.</p>
</div>
<a class="cta" href="#">Ver suplementos</a>
</section>
</main>
</body>
</html>
