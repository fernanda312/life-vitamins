<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFE vitamins — Vitaminas reais para pessoas reais</title>
<meta name="description" content="LIFE vitamins.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#fafaf7;color:#111;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.hero{position:relative;height:100svh;min-height:620px;overflow:hidden}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
header{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:24px 20px}
.logo{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:28px;letter-spacing:-.01em;line-height:1}
.logo em{font-style:italic;font-weight:400}
.menu-btn{width:32px;height:24px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0}
.menu-btn span{display:block;height:2.5px;background:#111;border-radius:2px}
.hero-text{position:relative;z-index:2;text-align:center;padding:28px 20px 60px;background:linear-gradient(to bottom,rgba(250,250,247,.92) 0%,rgba(250,250,247,.55) 55%,rgba(250,250,247,0) 100%)}
.hero-text h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:38px;line-height:1.02;letter-spacing:-.01em}
.hero-text h1 em{font-style:italic;font-weight:400}
.hero-text p{font-size:15px;line-height:1.6;max-width:340px;margin:22px auto 0;color:#222}
@media(min-width:801px){
header{padding:28px 40px}
.logo{font-size:34px}
.hero-text{padding-top:36px}
.hero-text h1{font-size:96px}
.hero-text p{font-size:17px;max-width:560px}
}
</style>
</head>
<body>
<main>
<section class="hero">
<img class="bg" src="images/hero-vitamins.jpg" alt="Vitaminas e multivitaminas LIFE vitamins">
<header>
<a class="logo" href="#">LIFE <em>vitamins</em></a>
<button class="menu-btn" aria-label="Menu"><span></span><span></span><span></span></button>
</header>
<div class="hero-text">
<h1>Vitaminas <em>reais</em><br>para pessoas reais</h1>
<p>Suplementos simples, para o dia a dia, em Maputo.</p>
</div>
</section>
</main>
</body>
</html>
